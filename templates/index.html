<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Generation Tool</title>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            margin: 20px;
            padding: 0;
            line-height: 1.6;
            background: linear-gradient(#000, #000f1b);
            color: #fafbf6;
        }
       
        a {
            text-decoration: none;
            color: #fafbf6;
        }
      
        footer {
          text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 20px;
            color: #fafbf6;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 2rem;
            font-weight: 600;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        select, input, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .hidden {
            display: none;
        }

        .graph-placeholder {
            width: 100%;
            height: 400px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafbf6;
            margin-top: 20px;
        }

        .graph-placeholder p {
            color: #666;
        }

        .info {
            font-size: 0.9em;
            color: #fafbf6;
            margin-top: -10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>xSynthia</h1>
        <p><em>A Customizable Tool for Generating Explainable Synthetic Association Network</em></p>
        <form id="settingsForm">
            <label for="model">Choose Model:</label>
            <select id="model" name="model">
                <option value="Qwen/Qwen2.5-72B-Instruct">Qwen/Qwen2.5-72B-Instruct</option>
                <option value="Qwen/QwQ-32B-Preview">Qwen/QwQ-32B-Preview</option>
                <option value="meta-llama/Llama-3.2-3B-Instruct">meta-llama/Llama-3.2-3B-Instruct</option>
                <option value="meta-llama/Llama-3.2-1B-Instruct">meta-llama/Llama-3.2-1B-Instruct</option>
                <option value="01-ai/Yi-1.5-34B-Chat">01-ai/Yi-1.5-34B-Chat</option>
                <option value="PowerInfer/SmallThinker-3B-Preview">PowerInfer/SmallThinker-3B-Preview</option>
                <option value="mistralai/Mistral-Nemo-Instruct-2407">mistralai/Mistral-Nemo-Instruct-2407</option>
                <option value="mistralai/Mistral-7B-Instruct-v0.3">mistralai/Mistral-7B-Instruct-v0.3</option>
                <option value="google/gemma-2-2b-it">google/gemma-2-2b-it</option>
                <option value="google/gemma-2-27b-it">google/gemma-2-27b-it</option>
            </select>

            <label for="samples">Number of Samples:</label>
            <input type="number" id="samples" name="samples" min="1" placeholder="Enter number of samples">

            <label for="associations">Number of Associations:</label>
            <input type="number" id="associations" name="associations" min="1" placeholder="Enter number of associations">

            <label for="startingPoint">Starting Point for Generation:</label>
            <select id="startingPoint" name="startingPoint" onchange="updateStartingPointInputs()">
                <option value="default">Default</option>
                <option value="randomSeed">Set Random Seed</option>
                <option value="setWord">Set Word</option>
            </select>

            <div id="randomSeedInput" class="hidden">
                <label for="randomSeedValue">Enter Random Seed (number):</label>
                <input type="number" id="randomSeedValue" name="randomSeedValue" placeholder="Enter a seed value">
            </div>

            <div id="setWordInput" class="hidden">
                <label for="wordList">Enter Word(s) (comma-separated):</label>
                <input type="text" id="wordList" name="wordList" placeholder="e.g., apple, banana, cherry">
            </div>

            <label for="visualizationLevels">Levels to Visualize:</label>
            <select id="visualizationLevels" name="visualizationLevels" onchange="showLevelInfo()">
                <option value="associationNetwork">Association Network</option>
                <option value="semanticLevel">Semantic Level</option>
                <option value="phonologicalLevel">Phonological Level</option>
                <option value="coOccurrencePatterns">Co-occurrence Patterns</option>
                <option value="semanticRelations">Semantic Relations</option>
            </select>
            
            <div id="levelInfo" class="info hidden"></div>
          
            <label for="graphType">Type of Graph:</label>
            <select id="graphType" name="graphType" onchange="showGraphTypeInfo()">
                <option value="generalGraph">General Graph</option>
                <option value="weightedGraph">Weighted Graph</option>
                <option value="multilayerGraph">Multilayer Graph</option>
            </select>

            <div id="graphTypeInfo" class="info hidden"></div>

            <button type="button" id="generateBtn">Generate Graph</button>
        </form>

        <div class="graph-placeholder">
            <p>Graph image will be displayed here</p>
        </div>
    </div>
    <footer>
      <p>© 2025 |<a href="github.com/vifirsanova"> mssvctr</a></p>
    </footer>
    <script>
        function updateStartingPointInputs() {
            const startingPoint = document.getElementById('startingPoint').value;
            document.getElementById('randomSeedInput').classList.add('hidden');
            document.getElementById('setWordInput').classList.add('hidden');

            if (startingPoint === 'randomSeed') {
                document.getElementById('randomSeedInput').classList.remove('hidden');
            } else if (startingPoint === 'setWord') {
                document.getElementById('setWordInput').classList.remove('hidden');
            }
        }
        
        function showLevelInfo() {
            const levelInfo = document.getElementById('levelInfo');
            const selectedLevel = document.getElementById('visualizationLevels').value;

            const infoText = {
                associationNetwork: "associations, visualized in a basic network",
                semanticLevel: "lexical items, grouped by semantic similarity",
                phonologicalLevel: "lexical items, grouped by phonological similarity",
                coOccurrencePatterns: "patterns of lexical items, appearing together",
                semanticRelations: "includes synonyms, antonyms, hyponyms, hypernyms, meronyms, holonyms, and co-occurrence patterns"
            };

            levelInfo.textContent = infoText[selectedLevel] || "";
            levelInfo.classList.remove('hidden');
        }
        
        function showGraphTypeInfo() {
            const graphTypeInfo = document.getElementById('graphTypeInfo');
            const selectedGraphType = document.getElementById('graphType').value;

            const graphInfoText = {
                generalGraph: "Just show me the graph: A general directed graph visualization, with node and edge attributes encoding additional information",
                weightedGraph: "Show me subgraphs: A weighted graph to represent the strength of associations and extract subgraphs by filtering edges based on weight thresholds",
                multilayerGraph: "Show layers of associations: A multilayer graph or hierarchical graph to organize associations into different levels or domains"
            };

            graphTypeInfo.textContent = graphInfoText[selectedGraphType] || "";
            graphTypeInfo.classList.remove('hidden');
        }

        document.getElementById('generateBtn').addEventListener('click', function() {
            const model = document.getElementById('model').value;
            const samples = document.getElementById('samples').value;
            const associations = document.getElementById('associations').value;
            const startingPoint = document.getElementById('startingPoint').value;
            const visualizationLevels = document.getElementById('visualizationLevels').value;

            let startingDetails = null;
            if (startingPoint === 'randomSeed') {
                startingDetails = document.getElementById('randomSeedValue').value;
            } else if (startingPoint === 'setWord') {
                startingDetails = document.getElementById('wordList').value;
            }

            // Replace graph placeholder content
            const placeholder = document.querySelector('.graph-placeholder');
            placeholder.innerHTML = '<p>Graph generated based on the selected settings</p>';
        });
            document.getElementById('generateBtn').addEventListener('click', function() {
        const formData = new FormData(document.getElementById('settingsForm'));

        fetch('/save-settings', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            console.log('Settings saved:', data);
            alert(data.message || 'Settings saved successfully!');
        })
        .catch(error => {
            console.error('Error saving settings:', error);
            alert('Failed to save settings.');
        });
    });
    </script>
</body>
</html>
